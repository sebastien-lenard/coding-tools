# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_tools"]

[project]
name = "coding-tools"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Automated workflows for workspace stamping and untracked file backups."
readme = "README.md"
requires-python = ">=3.12.9"
authors = [
    { name = "Sebastien Lenard", email = "sebastien.lenard@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.10.0",
]

[project.scripts]
batch-unit-test = "coding_tools.batch_unit_test_ask_gemini:main"
workspace-stamper = "coding_tools.workspace_stamper:main"
backup-untracked = "coding_tools.backup_untracked:main"
bundle-sources = "coding_tools.bundle_sources:main"

[project.optional-dependencies]
ai = [
    "google-genai>=2.16.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: end to end tests (slower)",
    "integration: integration and api tests (slower)",
    "unit: unit tests (faster)"
]
# log_cli = true
# log_cli_level = "INFO"

[tool.basedpyright]
extraPaths = ["src"]
typeCheckingMode = "standard" # Options: "basic", "standard", "recommended", "strict"

venvPath = "."
venv = ".venv" 

# Disable rules that complain about unannotated dynamic code
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

# Prevent duplicate warnings already handled by Ruff
reportUnusedImport = "none"
reportUnusedVariable = "none"

# Optional: Basedpyright can be strict about Any types. 
# Set to "warning" or "none" if it creates too much noise in existing code.
reportAny = "none" 

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "uv.lock"
]
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "ANN", "ARG", "BLE", "C4", "C90", "COM", "CPY", "D", "DTZ", "EM", "ERA", "EXE", "FA", "FBT", "FIX", "FLY", "FURB", "G", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "UP", "T10", "T20", "TC", "TD", "TID", "TRY", "W", "YTT"]
extend-ignore = ["D107"]
fixable = ["ALL"]
unfixable = []
allowed-confusables = ["ℹ"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001", # Allow apparently non accessed arguments
    "ARG005", # Allow apparently non accessed arguments
    "BLE001",  # Allow broad exception catching (great for checking fallback paths)
    "FBT001", # Allow boolean positional arguments
    "FBT002", # Allow boolean default positional arguments
    "PLR2004", # Allow numerical values not being constant
    "PLW0120", # Allow loose control structures if an LLM generated messy loop edge-case tests
    "PLR0913", # Allow many arguments
    "S101",    # Allow 'assert' statements (otherwise bandit flags every single test)
    "SLF001", # Access to private member
]
"__init__.py" = ["D104"]
"__main__.py" = ["D100", "D104"]

[tool.ruff.lint.flake8-copyright]
author = "Sebastien Lenard <sebastien.lenard@gmail.com> and Contributors"
notice-rgx = '(?i)SPDX-FileCopyrightText:\s*2026\s*'

[tool.ruff.format]
quote-style = "double"